[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academy-anpr"
version = "0.1.0"
description = "Offline single-gate ANPR MVP for academy vehicle logging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<0.137",
  "uvicorn>=0.46,<0.47",
  "sqlalchemy>=2.0,<2.1",
  "python-dotenv>=1.2,<1.3",
  "pytesseract>=0.3,<0.4",
  "ultralytics>=8.3,<8.4",
  "opencv-python>=4.12,<4.13",
  "requests>=2.32,<2.33",
  "pillow>=11.3,<11.4",
  "jinja2>=3.1,<3.2",
  "python-multipart>=0.0.27,<0.1",
]

[project.scripts]
anpr-api = "app.cli:run_api"
anpr-worker = "app.cli:run_worker"
anpr-dev = "app.cli:run_dev"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
